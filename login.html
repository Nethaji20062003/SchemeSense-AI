
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchemeSense AI - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #14213d, #2563eb);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 15px 40px #00000030;
    }

    h1 {
      text-align: center;
      color: #14213d;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
      color: #1f2937;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #otpSection {
      display: none;
    }

    #message {
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 18px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>🎓 SchemeSense AI</h1>

    <p class="subtitle">
      Secure Login Using Mobile Number
    </p>

    <div id="phoneSection">
      <label for="phone">Mobile Number</label>

      <input
        type="tel"
        id="phone"
        maxlength="10"
        inputmode="numeric"
        placeholder="Enter 10-digit mobile number"
      >

      <button type="button" onclick="sendOTP()">
        Send OTP
      </button>
    </div>

    <div id="otpSection">
      <label for="otp">Enter OTP</label>

      <input
        type="text"
        id="otp"
        maxlength="6"
        inputmode="numeric"
        placeholder="Enter 6-digit OTP"
      >

      <button type="button" onclick="verifyOTP()">
        Verify OTP & Login
      </button>

      <button type="button" onclick="goBack()">
        Change Mobile Number
      </button>
    </div>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back-link" href="index.html">
      Back to Dashboard
    </a>
  </div>

  <script>
    // DEMO ONLY: Not a real SMS OTP system.
    // Never use this fixed OTP for production authentication.

    const DEMO_OTP = "123456";

    let verifiedPhone = "";

    function sendOTP() {
      const phone = document.getElementById("phone").value.trim();
      const message = document.getElementById("message");

      if (!/^[6-9]\d{9}$/.test(phone)) {
        message.style.color = "#dc2626";
        message.textContent =
          "Please enter a valid 10-digit Indian mobile number.";
        return;
      }

      verifiedPhone = phone;

      document.getElementById("phoneSection").style.display = "none";
      document.getElementById("otpSection").style.display = "block";

      message.style.color = "#15803d";
      message.textContent =
        "Demo verification started. Enter the OTP provided for testing.";

      document.getElementById("otp").focus();
    }

    function verifyOTP() {
      const otp = document.getElementById("otp").value.trim();
      const message = document.getElementById("message");

      if (!/^\d{6}$/.test(otp)) {
        message.style.color = "#dc2626";
        message.textContent = "Enter a valid 6-digit OTP.";
        return;
      }

      if (otp !== DEMO_OTP) {
        message.style.color = "#dc2626";
        message.textContent = "Incorrect OTP. Please try again.";
        return;
      }

      sessionStorage.setItem("schemeDemoLoggedIn", "true");
      sessionStorage.setItem("schemeDemoPhone", verifiedPhone);

      message.style.color = "#15803d";
      message.textContent = "Demo login successful! Opening dashboard...";

      window.location.replace("index.html");
    }

    function goBack() {
      document.getElementById("otpSection").style.display = "none";
      document.getElementById("phoneSection").style.display = "block";
      document.getElementById("otp").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("message").textContent = "";
      verifiedPhone = "";
    }
  </script>

</body>
</html>
